[project]
name = "upperatmpy"
version = "0.2.9"
description = "Python wrapper for upper atmospheric models (MSIS, HWM, IGRF, CIRA, and auroral oval)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
keywords = ["atmospheric", "msis", "hwm", "space-weather", "ionosphere", "thermosphere"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
full = [
    "pandas>=1.3.0",
    "xarray>=0.19.0",
    "tqdm>=4.60.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/model", "src/utils"]
wheel.py-api = "py3"
sdist.exclude = ["TODO/**", ".upperatmpy/**", "data/**"]
cmake.args = ["-G", "Ninja"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_dll: marks tests that require compiled DLLs",
]
